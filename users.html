<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Quản Lý Người Dùng & Phê Duyệt – Hệ Thống Thiệp Cưới</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
    rel="stylesheet" />
  <!-- PocketBase JavaScript SDK -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pocketbase/0.21.5/pocketbase.umd.js"></script>

  <style>
    /* Chặn hiển thị giao diện khi chưa đăng nhập quyền Admin */
    body { display: none; }
  </style>
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('pocketbase_auth');
        if (!stored) {
          window.location.replace('/login');
          return;
        }
        const parsed = JSON.parse(stored);
        if (!parsed || !parsed.token || !parsed.model) {
          window.location.replace('/login');
          return;
        }
        const m = parsed.model;
        const isSuper = m.collectionName === '_superusers' || m.role === 'admin';
        if (!isSuper) {
          window.location.replace('/dashboard');
          return;
        }
      } catch (e) {
        window.location.replace('/login');
        return;
      }
      document.addEventListener('DOMContentLoaded', () => {
        document.body.style.display = '';
      });
    })();
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0c0e14;
      --surface: #141722;
      --surface2: #1c2130;
      --surface3: #252b3d;
      --border: #2c3247;
      --accent: #8b5cf6;
      --accent2: #ec4899;
      --gold: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
    }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAV HEADER */
    .dashboard-header {
      background: rgba(20, 23, 34, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.3);
    }

    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .user-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      font-size: 13px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 12px;
      color: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--surface2);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--surface3);
    }

    /* MAIN CONTAINER */
    .main-wrap {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 60px;
    }

    /* STATS OVERVIEW */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .stat-icon.total { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
    .stat-icon.pending { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .stat-icon.active { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .stat-icon.admin { background: rgba(236, 72, 153, 0.15); color: #f472b6; }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* TOOLBAR */
    .toolbar-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .toolbar-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
      max-width: 600px;
    }

    .search-input {
      flex: 1;
      min-width: 200px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .filter-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    /* TABLE */
    .table-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25);
    }

    .user-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    .user-table th {
      background: var(--surface2);
      padding: 14px 18px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .user-table td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .user-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .user-meta-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .u-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }

    .u-name {
      font-weight: 600;
      color: #fff;
    }

    .u-email {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .badge-status.active {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-status.pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-role {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-role.admin {
      background: rgba(236, 72, 153, 0.15);
      color: #f472b6;
      border: 1px solid rgba(236, 72, 153, 0.3);
    }

    .badge-role.member {
      background: rgba(148, 163, 184, 0.12);
      color: #94a3b8;
    }

    /* ACTION BUTTONS IN TABLE */
    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-action-sm {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn-approve {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .btn-approve:hover {
      background: #10b981;
      color: #fff;
    }

    .btn-block {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .btn-block:hover {
      background: #f59e0b;
      color: #fff;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-delete:hover {
      background: #ef4444;
      color: #fff;
    }

    /* EMPTY & LOADING */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 13.5px;
      z-index: 999;
      display: none;
    }

    .toast.show {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <!-- HEADER -->
  <header class="dashboard-header">
    <div class="brand-group">
      <div class="brand-icon">👥</div>
      <div>
        <h1 class="brand-title">Quản Lý Người Dùng</h1>
        <p class="brand-subtitle">Phê duyệt thành viên & phân quyền hệ thống</p>
      </div>
    </div>

    <div class="user-actions">
      <div class="user-pill">
        <div class="user-avatar" id="adminAvatar">A</div>
        <span id="adminName">Admin</span>
        <span class="badge-role admin" style="margin-left: 4px;">Admin</span>
      </div>

      <a href="/dashboard" class="btn btn-secondary">
        <span>📋 Danh Sách Thiệp</span>
      </a>

      <a href="/admin?new=1" class="btn btn-primary">
        <span>+ Tạo Thiệp Mới</span>
      </a>

      <button onclick="handleLogout()" class="btn btn-secondary">
        <span>Đăng Xuất</span> ↪
      </button>
    </div>
  </header>

  <!-- MAIN WRAP -->
  <main class="main-wrap">
    <!-- STATS OVERVIEW -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon total">👥</div>
        <div>
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Tổng người dùng</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon pending">⏳</div>
        <div>
          <div class="stat-value" id="statPending" style="color:#fbbf24;">0</div>
          <div class="stat-label">Chờ phê duyệt</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon active">🟢</div>
        <div>
          <div class="stat-value" id="statActive" style="color:#34d399;">0</div>
          <div class="stat-label">Đã kích hoạt</div>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon admin">🛡️</div>
        <div>
          <div class="stat-value" id="statAdmin" style="color:#f472b6;">0</div>
          <div class="stat-label">Quản trị viên</div>
        </div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar-bar">
      <div class="toolbar-controls">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm theo tên hoặc email..." oninput="handleFilter()" />
        <select id="statusFilter" class="filter-select" onchange="handleFilter()">
          <option value="">Tất cả trạng thái</option>
          <option value="pending">⏳ Chờ duyệt</option>
          <option value="active">🟢 Đã kích hoạt</option>
          <option value="admin">🛡️ Quản trị viên</option>
        </select>
      </div>

      <button onclick="loadUsers()" class="btn btn-secondary">
        🔄 Làm mới
      </button>
    </div>

    <!-- USER TABLE -->
    <div class="table-container">
      <table class="user-table">
        <thead>
          <tr>
            <th>Người Dùng</th>
            <th>Trạng Thái</th>
            <th>Vai Trò</th>
            <th>Ngày Đăng Ký</th>
            <th>Hành Động</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="5" class="empty-state">⏳ Đang tải danh sách người dùng...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const DEFAULT_PB = window.location.port === '8090' ? window.location.origin : 'http://127.0.0.1:8090';
    const pbUrl = localStorage.getItem('pb_url') || DEFAULT_PB;
    const pb = new PocketBase(pbUrl);

    // 1. AUTHENTICATION & ADMIN PERMISSION GUARD
    if (!pb.authStore.isValid || !pb.authStore.model) {
      window.location.replace('/login');
    }

    const currentUser = pb.authStore.model;
    const isSuperUser = pb.authStore.isSuperuser || currentUser?.collectionName === '_superusers' || currentUser?.role === 'admin';

    if (!isSuperUser) {
      alert('⚠️ Bạn không có quyền quản trị viên để truy cập trang này!');
      window.location.replace('/dashboard');
    }

    // Set Header Admin Info
    const adminDisplay = currentUser.name || currentUser.email || 'Admin';
    document.getElementById('adminName').textContent = adminDisplay;
    document.getElementById('adminAvatar').textContent = adminDisplay.charAt(0).toUpperCase();

    let allUsers = [];

    async function loadUsers() {
      try {
        let records = [];
        try {
          records = await pb.collection('users').getFullList({
            sort: '-created'
          });
        } catch (sortErr) {
          console.warn('Sort by created failed, fetching without sort:', sortErr);
          records = await pb.collection('users').getFullList();
        }
        // Client-side sort fallback
        records.sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
        allUsers = records;
        updateStats(records);
        renderUsers(records);
      } catch (err) {
        console.error('Lỗi tải người dùng:', err);
        showToast('❌ Không thể tải danh sách người dùng: ' + (err.message || 'Lỗi phân quyền'));
        document.getElementById('userTableBody').innerHTML = `
          <tr>
            <td colspan="5" class="empty-state">❌ Lỗi: ${err.message}. Hãy đảm bảo bạn đã đăng nhập tài khoản Superuser hoặc Admin.</td>
          </tr>
        `;
      }
    }

    function updateStats(users) {
      document.getElementById('statTotal').textContent = users.length;
      const pendingCount = users.filter(u => !u.verified && u.role !== 'admin').length;
      const activeCount = users.filter(u => u.verified).length;
      const adminCount = users.filter(u => u.role === 'admin').length;

      document.getElementById('statPending').textContent = pendingCount;
      document.getElementById('statActive').textContent = activeCount;
      document.getElementById('statAdmin').textContent = adminCount;
    }

    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody');
      if (!users || users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Không tìm thấy người dùng nào phù hợp.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        const name = u.name || 'Chưa đặt tên';
        const email = u.email || 'Không có email';
        const initial = name.charAt(0).toUpperCase();
        const isApproved = !!u.verified;
        const isAdmin = u.role === 'admin';
        const createdDate = u.created ? new Date(u.created).toLocaleDateString('vi-VN', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        }) : '---';

        return `
          <tr>
            <td>
              <div class="user-meta-cell">
                <div class="u-avatar">${initial}</div>
                <div>
                  <div class="u-name">${escapeHtml(name)}</div>
                  <div class="u-email">${escapeHtml(email)}</div>
                </div>
              </div>
            </td>
            <td>
              ${isApproved 
                ? `<span class="badge-status active">🟢 Đã kích hoạt</span>` 
                : `<span class="badge-status pending">⏳ Chờ duyệt</span>`
              }
            </td>
            <td>
              <span class="badge-role ${isAdmin ? 'admin' : 'member'}">
                ${isAdmin ? '🛡️ Admin' : 'Thành viên'}
              </span>
            </td>
            <td style="color:var(--text-muted); font-size:12.5px;">${createdDate}</td>
            <td>
              <div class="action-group">
                ${!isApproved 
                  ? `<button class="btn-action-sm btn-approve" onclick="toggleApprove('${u.id}', true, '${escapeHtml(name)}')">
                      ✓ Duyệt tài khoản
                     </button>`
                  : `<button class="btn-action-sm btn-block" onclick="toggleApprove('${u.id}', false, '${escapeHtml(name)}')">
                      ⏸ Khóa
                     </button>`
                }

                <button class="btn-action-sm btn-secondary" onclick="toggleRole('${u.id}', '${isAdmin ? 'member' : 'admin'}', '${escapeHtml(name)}')">
                  ${isAdmin ? 'Hạ quyền' : '⭐ Admin'}
                </button>

                <button class="btn-action-sm btn-delete" onclick="deleteUser('${u.id}', '${escapeHtml(name)}')">
                  🗑️
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleApprove(userId, approveState, userName) {
      const actionName = approveState ? 'phê duyệt' : 'khóa';
      try {
        await pb.collection('users').update(userId, {
          verified: approveState
        });
        showToast(`✅ Đã ${actionName} tài khoản cho "${userName}"!`);
        await loadUsers();
      } catch (err) {
        console.error(err);
        showToast(`❌ Thất bại: ${err.message || 'Lỗi phân quyền'}`);
      }
    }

    async function toggleRole(userId, newRole, userName) {
      try {
        await pb.collection('users').update(userId, {
          role: newRole
        });
        showToast(`✅ Đã chuyển vai trò của "${userName}" thành "${newRole}"!`);
        await loadUsers();
      } catch (err) {
        console.error(err);
        showToast(`❌ Thất bại: ${err.message}`);
      }
    }

    async function deleteUser(userId, userName) {
      if (!confirm(`Bạn có chắc muốn xóa vĩnh viễn tài khoản "${userName}"?`)) {
        return;
      }
      try {
        await pb.collection('users').delete(userId);
        showToast(`✅ Đã xóa người dùng "${userName}"!`);
        await loadUsers();
      } catch (err) {
        console.error(err);
        showToast(`❌ Không thể xóa: ${err.message}`);
      }
    }

    function handleFilter() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('statusFilter').value;

      const filtered = allUsers.filter(u => {
        const name = (u.name || '').toLowerCase();
        const email = (u.email || '').toLowerCase();
        const matchQ = !q || name.includes(q) || email.includes(q);

        let matchStatus = true;
        if (status === 'pending') matchStatus = !u.verified && u.role !== 'admin';
        else if (status === 'active') matchStatus = !!u.verified;
        else if (status === 'admin') matchStatus = u.role === 'admin';

        return matchQ && matchStatus;
      });

      renderUsers(filtered);
    }

    function handleLogout() {
      pb.authStore.clear();
      showToast('Đã đăng xuất.');
      setTimeout(() => {
        window.location.replace('/login');
      }, 500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
    }

    // Khởi chạy
    loadUsers();
  </script>
</body>

</html>
